server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Com o upstream numa variável (abaixo), faz o nome ser resolvido em runtime:
  # sem isso o nginx tenta resolver `backend` ao carregar a config e morre no
  # boot se o backend ainda não subiu.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Painel e API na mesma origem: é o que permite o cookie de sessão sem CORS,
  # e o que dispensa publicar a porta do backend no host.
  location /api/ {
    set $api_upstream backend:3333;
    # O backend segue enxergando /matches, /auth/login… — nenhuma rota mudou.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;

    proxy_http_version 1.1;
    # $http_host e não $host: o $host descarta a porta, e aí a checagem de CSRF
    # do backend compara "http://ip:5000" com "http://ip" e barra todo POST.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O login do Telegram fala com a rede da Telegram dentro da request; o
    # default de 60s é justo demais.
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
