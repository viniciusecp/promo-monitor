services:
  backend:
    build: ./server
    container_name: promo-monitor-server
    restart: unless-stopped
    # Sem `ports` de propósito: quem fala com o backend é o nginx do `web`
    # (location /api/). Publicar esta porta recolocaria /telegram/auth/* e
    # /settings direto na internet, sem razão nenhuma.
    expose:
      - "4999"
    env_file:
      - ./server/.env
    environment:
      - API_PORT=4999
      - TELEGRAM_SESSION_FILE=/app/session/telegram.session
      - TELEGRAM_BOT_SESSION_FILE=/app/session/bot.session
    volumes:
      - ./server/data:/app/data
      - ./server/session:/app/session

  web:
    build:
      context: ./web
    container_name: promo-monitor-web
    restart: unless-stopped
    # Única porta publicada: painel e API compartilham esta origem.
    ports:
      - "${WEB_PORT:-5000}:80"
    depends_on:
      - backend
